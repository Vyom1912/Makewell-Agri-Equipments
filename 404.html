<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Makewell Agri Equipments</title>
    <script>
      // GitHub Pages SPA redirect — encode the current path into a query string
      // and redirect to the root index.html which will decode and restore it.
      // See: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the repo name segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?p=/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>Redirecting…</body>
</html>
